data:
  raw_dir: data/raw/aemo/
  processed_path: data/processed/
  processed_file: data/processed/aemo_nem_demand_hourly.csv
  db_path: data/live/aemo.db
  timestamp_col: timestamp
  target_col: demand
  regions: [NSW1, QLD1, SA1, TAS1, VIC1]
  timezone: Etc/GMT-10 # NEM market time: fixed UTC+10, no daylight saving
  frequency: h

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

features:
  lags: [1, 2, 6, 24, 48, 168]
  rolling_windows: [3, 6, 12, 24, 168]
  cyclical: [hour, day_of_week, month]

aemo:
  # Not used by the collector: ELEC_NEM_SUMMARY reports TOTALDEMAND, a
  # different metric than OPERATIONAL_DEMAND below - mixing them would
  # create a discontinuity at the historical/live boundary. Kept here only
  # as a reference for a possible future price/interconnector feature.
  live_endpoint: https://visualisations.aemo.com.au/aemo/apps/api/report/ELEC_NEM_SUMMARY
  archive_url_template: https://nemweb.com.au/Reports/Archive/Operational_Demand/ACTUAL_HH/PUBLIC_ACTUAL_OPERATIONAL_DEMAND_HH_{date}.zip
  current_dir_url: https://nemweb.com.au/Reports/Current/Operational_Demand/ACTUAL_HH/
  poll_interval_seconds: 300

inference:
  interval_seconds: 300

lstm:
  sequence_length: 24 # hours of history per training window
  units: 64
  dropout: 0.2
  learning_rate: 0.001
  epochs: 50
  batch_size: 32
  early_stopping_patience: 5

models:
  xgboost_path: models/aemo/xgboost_v1.pkl
  xgboost_feature_columns: models/aemo/xgboost_v1_feature_columns.json
  lstm_path: models/aemo/lstm_v1.keras
  lstm_scaler_path: models/aemo/lstm_v1_scaler.pkl
  lstm_feature_columns: models/aemo/lstm_v1_feature_columns.json
  version: v1

random_seed: 42
